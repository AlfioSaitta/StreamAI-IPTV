# Config nfpm di BASE — non usare direttamente con `nfpm pkg`.
#
# Le dipendenze sono per-distro e nfpm supporta `overrides` solo per packager,
# quindi il blocco `overrides:` NON è qui: lo genera
# `scripts/make-nfpm-config.mjs <distro>` a partire dalla tabella
# `build/depends/distros.json`, e `scripts/build-linux.sh` lo passa a nfpm con
# `--config`. Usare questo file così com'è produrrebbe un pacchetto senza
# dipendenze dichiarate.
#
# `${VERSION}` e `${RELEASE}` sono espansi da nfpm dall'ambiente: lo script li
# esporta prima di invocarlo.
name: "streamai-iptv"
# Solo x86_64: la build è nativa (cgo + libmpv) e non c'è cross-compilazione.
# Per aarch64 servirebbe parametrizzare anche questo campo.
arch: "amd64"
platform: "linux"
version: "${VERSION}"
release: "${RELEASE}"
section: "video"
priority: "optional"
maintainer: "Alfio Saitta <alfio@collateralstudios.com>"
description: "Advanced AI-powered IPTV client (Google Gemini)"
vendor: "Collateral Studios"
homepage: "https://github.com/AlfioSaitta/StreamAI-IPTV"
license: "MIT"

contents:
  - src: "./build/bin/streamai"
    dst: "/usr/bin/streamai"
    file_info:
      mode: 0755
  - src: "./build/streamai.desktop"
    dst: "/usr/share/applications/streamai.desktop"
  - src: "./build/icons/16x16.png"
    dst: "/usr/share/icons/hicolor/16x16/apps/streamai.png"
  - src: "./build/icons/32x32.png"
    dst: "/usr/share/icons/hicolor/32x32/apps/streamai.png"
  - src: "./build/icons/48x48.png"
    dst: "/usr/share/icons/hicolor/48x48/apps/streamai.png"
  - src: "./build/icons/64x64.png"
    dst: "/usr/share/icons/hicolor/64x64/apps/streamai.png"
  - src: "./build/icons/128x128.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/streamai.png"
  - src: "./build/icons/256x256.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/streamai.png"
  - src: "./build/icons/512x512.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/streamai.png"
