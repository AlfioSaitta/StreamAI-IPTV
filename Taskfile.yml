# Taskfile per StreamAI-IPTV Wails v3 — vedi docs/plan-go-wails-migration.md §2.2.
#
# Eseguire i task con: `task <name>` (richiede github.com/go-task/task v3).
# Wails3 invoca questo Taskfile automaticamente da `wails3 build`/`wails3 dev`.

version: "3"

# Wails v3 alpha.93 su openSUSE TW richiede il build-tag `gtk3` per usare
# webkit2gtk-4.1 (webkitgtk-6.0 non ancora pacchettizzato). Su distro con
# webkitgtk-6.0 disponibile (Ubuntu 24.04+, Fedora 40+, Arch) rimuovere
# il tag: `task build TAGS=""`.
vars:
  TAGS: '{{.TAGS | default "gtk3"}}'
  BIN_NAME: streamai
  BIN_DIR: build/bin
  VERSION:
    sh: cat .version 2>/dev/null || echo dev
  COMMIT_SHA:
    sh: git rev-parse --short=7 HEAD 2>/dev/null || echo ""
  LDFLAGS: '-s -w -X main.version={{.VERSION}} -X main.commitSHA={{.COMMIT_SHA}}'

tasks:
  default:
    desc: Mostra l'elenco dei task disponibili.
    cmds:
      - task --list-all

  # ---- Frontend ----
  frontend:install:
    desc: Installa dipendenze npm del frontend.
    cmds:
      - npm install

  frontend:build:
    desc: Build frontend (Vite) -> frontend/dist/ (consumato da //go:embed in assets.go).
    deps: [frontend:install]
    cmds:
      - npm run build

  # ---- Backend Go ----
  generate:bindings:
    desc: Genera binding TypeScript dai Service Go (frontend/bindings/*).
    cmds:
      - wails3 generate bindings -ts -d frontend/bindings ./...

  build:
    desc: Build completo (frontend + backend).
    deps: [frontend:build]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -tags "{{.TAGS}}" -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.BIN_NAME}} ./cmd/streamai
      - echo "Built {{.BIN_DIR}}/{{.BIN_NAME}} v{{.VERSION}} ({{.COMMIT_SHA}})"

  build:debug:
    desc: Build di debug con symbol info.
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -tags "{{.TAGS}}" -gcflags="all=-N -l" -o {{.BIN_DIR}}/{{.BIN_NAME}}-debug ./cmd/streamai

  dev:
    desc: Avvia Wails v3 in modalita' sviluppo (hot-reload Vite + Go).
    cmds:
      - wails3 dev -tags "{{.TAGS}}"

  # ---- Quality gates ----
  lint:
    desc: golangci-lint + check-wails-v3 (regression guard v2).
    cmds:
      - golangci-lint run --build-tags "{{.TAGS}}" ./...
      - node scripts/check-wails-v3.mjs

  test:
    desc: Test Go con race detector.
    cmds:
      - go test -tags "{{.TAGS}}" -race -count=1 ./...

  vet:
    desc: go vet.
    cmds:
      - go vet -tags "{{.TAGS}}" ./...

  tidy:
    desc: go mod tidy.
    cmds:
      - go mod tidy

  # ---- Packaging (Linux, fase 8) ----
  package:linux:
    desc: |
      Build pacchetto Linux per la distro host. Vedi docs/plan-go-wails-migration.md §5.1.
      Usa nfpm dopo aver buildato il binario (Fase 8 del piano migrazione).
    deps: [build]
    cmds:
      - echo "TODO Fase 8 — placeholder per nfpm pkg --packager deb|rpm|archlinux"

  package:windows:
    desc: |
      Build installer Windows (NSIS Authenticode). Vedi piano §5.2 / Fase 9.
    cmds:
      - echo "TODO Fase 9 — placeholder windows-release"

  package:darwin:
    desc: |
      Build DMG universal macOS notarizzato. Vedi piano §5.3 / Fase 9-bis.
    cmds:
      - echo "TODO Fase 9-bis — placeholder macos-release"

  # ---- SPIKE-1 (Fase 6.0 — libmpv → WebGL2 preflight) ----
  spike:1:build:
    desc: |
      Build dell'harness Go SPIKE-1 (libmpv render → EGL surfaceless → FBO).
      Richiede libmpv-dev + libegl1-mesa-dev + libgl1-mesa-dev (vedi
      docs/spike1-methodology.md). Build tag 'mpv spike1' obbligatori.
    env:
      # mpv-devel su openSUSE TW (e altre distro recenti) espone
      # -fno-strict-overflow nelle CFLAGS pkg-config; cgo lo blocca
      # per default. Whitelistato qui (è un flag GCC innocuo).
      CGO_CFLAGS_ALLOW: '-fno-strict-overflow'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -tags "mpv spike1 {{.TAGS}}" -trimpath -o {{.BIN_DIR}}/spike-mpv-render ./cmd/spike-mpv-render
      - echo "Built {{.BIN_DIR}}/spike-mpv-render"

  spike:1:smoke:
    desc: |
      Smoke test rapido (8 s @ 1080p60 + 8 s @ 4K60) usando una sorgente
      sintetica libavfilter (av://lavfi:testsrc2). Non richiede codec
      HEVC/H.264 nel sistema — utile per validare il pipeline EGL+FBO+
      readback senza dipendere dall'installazione codec dell'host.
    deps: [spike:1:build]
    cmds:
      - mkdir -p dist/spike1
      - ./{{.BIN_DIR}}/spike-mpv-render -url 'av://lavfi:testsrc2=size=1920x1080:rate=60' -duration 8s -warmup 2s -fbo-width 1920 -fbo-height 1080 -hwdec no -output dist/spike1/smoke-1080p.json
      - ./{{.BIN_DIR}}/spike-mpv-render -url 'av://lavfi:testsrc2=size=3840x2160:rate=60' -duration 8s -warmup 2s -fbo-width 3840 -fbo-height 2160 -hwdec no -output dist/spike1/smoke-4k.json
      - 'echo "Smoke reports: dist/spike1/smoke-1080p.json + smoke-4k.json"'
      - 'grep -E "\"(p50|p95|p99|max|result|frames)\"" dist/spike1/smoke-1080p.json dist/spike1/smoke-4k.json || true'

  spike:1:run:
    desc: |
      Esegue il bench SPIKE-1 su 1080p + 4K (set SPIKE1_URL nell'env).
      Esempio: SPIKE1_URL=https://.../bbb_4k_hevc.mkv task spike:1:run
    deps: [spike:1:build]
    cmds:
      - bash scripts/spike1-bench.sh

  spike:1:serve-frontend:
    desc: |
      Serve il PoC WebGL2 (frontend/spike/mpv-webgl2/) su :7800.
      Da usare in parallelo all'harness Go: l'harness espone /snapshot
      su :7799, il PoC fa fetch verso quell'endpoint.
    cmds:
      - npx vite --port 7800 --open frontend/spike/mpv-webgl2/

  clean:
    desc: Pulisce artefatti di build.
    cmds:
      - rm -rf build/bin dist frontend/bindings
      - go clean -cache -testcache

