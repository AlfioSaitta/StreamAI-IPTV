<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Settings for Android/iOS -->
    <title>StreamAI IPTV</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#141414" />

    <!-- App icons (locali, generati da docs/assets/Icon.png) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- iOS Specific Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StreamAI" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google Cast SDK (opzionale, può essere rimosso se non usato) -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1" async></script>

    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-gray-900 text-white selection:bg-purple-500 selection:text-white">
    <div id="root">
      <!-- Loading fallback - verrà sostituito da React -->
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #141414;">
        <div style="text-align: center; color: white;">
          <div style="font-size: 24px; margin-bottom: 16px;">StreamAI</div>
          <div style="font-size: 14px; opacity: 0.7;">Caricamento...</div>
        </div>
      </div>
    </div>

    <!-- Vite Entry Point -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
