name: Linux Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  pages: write

jobs:
  build:
    name: Build & sign Linux packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm fakeroot debsigs reprepro createrepo-c \
            libarchive-tools zstd gnupg2

      - name: Install npm dependencies
        run: npm ci

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          trust_level: 5

      - name: Build all Linux packages
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/build-linux.sh --all

      - name: Verify signatures
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -e
          cd dist
          for f in *.rpm; do [[ -e "$f" ]] && rpm --checksig "$f"; done
          for f in *.deb; do [[ -e "$f" ]] && debsigs --verify "$f" || true; done
          for f in *.pkg.tar.zst; do [[ -e "$f" ]] && gpg --verify "${f}.sig" "$f"; done
          for f in *.AppImage *.tar.xz; do [[ -e "$f" ]] && gpg --verify "${f}.asc" "$f"; done
          gpg --verify SHA256SUMS.asc SHA256SUMS

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/*.tar.xz
            dist/SHA256SUMS

      - name: Upload artefacts (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/*.tar.xz
            dist/*.asc
            dist/*.sig
            dist/SHA256SUMS*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/*.tar.xz
            dist/*.asc
            dist/*.sig
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
          generate_release_notes: true

  pages:
    name: Publish APT/RPM/Arch repository on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install repo tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            reprepro createrepo-c libarchive-tools zstd gnupg2

      - name: Download built artefacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist/

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          trust_level: 5

      - name: Assemble public-repo (apt + rpm + arch via Docker)
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          REPO_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: bash scripts/publish-repo.sh

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public-repo
          publish_branch: gh-pages
          keep_files: true
          commit_message: "chore(release): publish ${{ needs.build.outputs.version }}"

