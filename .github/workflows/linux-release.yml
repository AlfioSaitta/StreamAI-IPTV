name: Linux Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  pages: write

jobs:
  build:
    name: Build & sign Linux packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ---- Caches --------------------------------------------------------
      # 1) Electron binary archives (~80 MB per version): re-used across
      #    every electron-builder target — both native and inside Docker
      #    (build-linux.sh mounts $HOME/.cache/electron into the container).
      # 2) electron-builder caches: fpm bundle, AppImage tools, 7za, etc.
      #    (~200 MB cumulative). Same volume-mount trick applies.
      # Keyed on package-lock.json so the cache only invalidates when
      # electron / electron-builder versions change.
      - name: Cache Electron + electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # 3) APT archives for the packaging toolchain. cache-apt-pkgs-action
      #    persists /var/cache/apt/archives across runs and replays the
      #    install from cache when the package set is unchanged (~30 s -> ~3 s).
      - name: Install packaging toolchain (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: rpm fakeroot debsigs reprepro createrepo-c libarchive-tools zstd gnupg2
          version: v1

      # 4) Docker images pulled by build-linux.sh (rpmbuild >= 4.20 on noble
      #    triggers the electronuserland/builder fallback for every .rpm
      #    job). Caching the image saves the ~1 GB pull each run.
      - name: Cache Docker images (electronuserland/builder)
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-electronuserland-builder

      - name: Install npm dependencies
        run: npm ci

      # Single source of truth for the version number lives in /.version.
      # In CI we additionally export $COMMIT_SHA so every per-distro
      # artefact embeds the short commit SHA in its filename, e.g.
      #   streamai-iptv_1.0.0_276ee32_debian_amd64.deb
      # build-linux.sh forwards $COMMIT_SHA to make-distro-config.mjs.
      - name: Sync version metadata
        run: |
          COMMIT_SHORT="${GITHUB_SHA::7}"
          echo "COMMIT_SHA=${COMMIT_SHORT}" >> "$GITHUB_ENV"
          node scripts/sync-version.mjs
          FULL_VERSION="$(COMMIT_SHA=${COMMIT_SHORT} node scripts/sync-version.mjs --print-full)"
          echo "FULL_VERSION=${FULL_VERSION}" >> "$GITHUB_ENV"
          echo "▶ Build version: ${FULL_VERSION}"

      - name: Verify signing secrets are present
        env:
          KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASS: ${{ secrets.GPG_PASSPHRASE }}
          KID: ${{ secrets.GPG_KEY_ID }}
        run: |
          missing=()
          [[ -z "$KEY"  ]] && missing+=(GPG_PRIVATE_KEY)
          [[ -z "$PASS" ]] && missing+=(GPG_PASSPHRASE)
          [[ -z "$KID"  ]] && missing+=(GPG_KEY_ID)
          if (( ${#missing[@]} )); then
            echo "::error::Missing required secrets: ${missing[*]}."
            echo "::error::Configure them locally with:"
            echo "::error::  npm run gpg:upload"
            echo "::error::or in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/import-gpg-key.sh

      - name: Build per-distro Linux packages
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # Build only the native per-distro packages (opensuse, fedora, rhel,
        # debian, ubuntu, arch). Generic SONAME-based and portable targets
        # (AppImage, tar.xz) are intentionally NOT produced in CI.
        run: |
          bash scripts/build-linux.sh \
            --opensuse --fedora --rhel \
            --debian --ubuntu --arch

      - name: Verify signatures
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        # Fail the pipeline if any artefact is unsigned or its signature does
        # not validate against the maintainer key.
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob

          fail=0

          # Import the maintainer public key into a *dedicated* rpm keyring;
          # using `sudo rpm --import` would write into root's rpmdb while
          # `rpm --checksig` (run as the runner user) reads from ~/.rpmdb,
          # so the key would be invisible to verification → NOKEY.
          PUBKEY="$(mktemp --suffix=.asc)"
          gpg --export --armor "$GPG_KEY_ID" > "$PUBKEY"
          RPMDB="$(mktemp -d)"
          if compgen -G '*.rpm' >/dev/null; then
            rpm --dbpath "$RPMDB" --initdb
            rpm --dbpath "$RPMDB" --import "$PUBKEY"
          fi

          # ---- RPM: with the pubkey imported, a signed package reports
          # "digests signatures OK"; an unsigned one reports "digests OK"
          # (no 'signatures' token). NOKEY would still contain 'NOKEY'.
          for f in *.rpm; do
            if ! out="$(rpm --dbpath "$RPMDB" --checksig -v "$f" 2>&1)"; then
              echo "$out"
              echo "::error::RPM $f failed rpm --checksig (exit non-zero)" >&2
              fail=1
              continue
            fi
            echo "$out"
            if grep -qi 'NOKEY' <<<"$out"; then
              echo "::error::RPM $f signed by an untrusted key (NOKEY)" >&2
              fail=1
            elif ! grep -qiE '(signatures|pgp|rsa|dsa|eddsa).*OK' <<<"$out"; then
              echo "::error::RPM $f appears to be unsigned" >&2
              fail=1
            fi
          done

          # ---- DEB: debsigs --sign=origin embeds an OpenPGP detached
          # signature as the ar member '_gpgorigin', covering the
          # concatenation of debian-binary + control.tar.* + data.tar.*.
          # debsigs --verify needs system policy files we don't ship in CI,
          # so we extract the signature and verify it manually with gpg.
          DIST_ABS="$PWD"
          for f in *.deb; do
            members="$(ar t "$f")"
            sig_member=""
            if grep -qx '_gpgorigin' <<<"$members"; then
              sig_member="_gpgorigin"
            elif grep -qx '_gpgbuilder' <<<"$members"; then
              sig_member="_gpgbuilder"
            else
              echo "::error::DEB $f has no _gpgorigin/_gpgbuilder ar member (unsigned)" >&2
              fail=1
              continue
            fi
            tmpdir="$(mktemp -d)"
            ( cd "$tmpdir" && ar x "$DIST_ABS/$f" )
            # Concatenate the signed members in the *actual* ar order
            # (as reported by `ar t`), skipping the signature member
            # itself. debsigs/dpkg-sig sign the byte-for-byte
            # concatenation of the remaining members in archive order;
            # any deviation produces a BAD signature.
            signed_blob="$tmpdir/.signed"
            : > "$signed_blob"
            while IFS= read -r m; do
              case "$m" in
                ''|_gpgorigin|_gpgbuilder) continue ;;
              esac
              if [[ -f "$tmpdir/$m" ]]; then
                cat "$tmpdir/$m" >> "$signed_blob"
              else
                echo "::warning::DEB $f: ar lists '$m' but the extracted file is missing" >&2
              fi
            done <<<"$members"
            if gpg --verify "$tmpdir/$sig_member" "$signed_blob" 2>&1; then
              echo "  ✓ $f ($sig_member) OK"
            else
              echo "::error::DEB $f signature ($sig_member) does not validate" >&2
              fail=1
            fi
            rm -rf "$tmpdir"
          done

          # ---- Arch: detached .sig produced by gpg --detach-sign.
          for f in *.pkg.tar.zst; do
            if [[ ! -f "${f}.sig" ]]; then
              echo "::error::Missing detached signature ${f}.sig" >&2
              fail=1
              continue
            fi
            if ! gpg --verify "${f}.sig" "$f"; then
              echo "::error::Signature ${f}.sig does not validate" >&2
              fail=1
            fi
          done

          # ---- Checksums manifest.
          if [[ ! -f SHA256SUMS || ! -f SHA256SUMS.asc ]]; then
            echo "::error::SHA256SUMS / SHA256SUMS.asc missing" >&2
            fail=1
          else
            gpg --verify SHA256SUMS.asc SHA256SUMS
            sha256sum --check SHA256SUMS
          fi

          # ---- Cross-check: assert at least one artefact per expected distro.
          for distro in opensuse fedora rhel debian ubuntu arch; do
            case "$distro" in
              opensuse|fedora|rhel) pat="*_${distro}_*.rpm" ;;
              debian|ubuntu)        pat="*_${distro}_*.deb" ;;
              arch)                 pat="*_arch_*.pkg.tar.zst" ;;
            esac
            if ! compgen -G "$pat" >/dev/null; then
              echo "::error::No artefact produced for distro=${distro} (pattern: $pat)" >&2
              fail=1
            fi
          done

          exit "$fail"

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/SHA256SUMS

      - name: Upload artefacts (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.asc
            dist/*.sig
            dist/SHA256SUMS*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.asc
            dist/*.sig
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
          generate_release_notes: true

  pages:
    name: Publish APT/RPM/Arch repository on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Use the official GitHub Pages deployment environment so the
    # actions/deploy-pages@v4 step can publish via the Pages API (no
    # git push, no pack-size limits — bypasses the recurring HTTP 500
    # we saw with peaceiris/actions-gh-pages@v4 once the accumulated
    # repo grew large).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install repo tooling (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: reprepro createrepo-c libarchive-tools zstd gnupg2
          version: v1

      # publish-repo.sh uses 'docker run archlinux:latest' for 'repo-add';
      # cache the ~400 MB image across runs.
      - name: Cache Docker images (archlinux:latest)
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-archlinux-latest

      - name: Download built artefacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist/

      # Seed public-repo/ with the historical content of the previously
      # deployed Pages site (so reprepro / createrepo_c / repo-add can
      # rebuild metadata over the union of old + new packages).
      #
      # Primary source: actions/cache (keyed by `pages-history-v1`).
      # Fallback (cache evicted after 7 days unused): download every
      # signed package from past GitHub Releases via `gh release`.
      # GitHub Release assets are permanent storage — there is no
      # equivalent of the `git push` HTTP 500 we used to hit when
      # mirroring to the `gh-pages` branch.
      - name: Restore cached Pages history
        id: pages-cache
        uses: actions/cache/restore@v4
        with:
          path: public-repo
          key: pages-history-v1-${{ github.run_id }}
          restore-keys: |
            pages-history-v1-

      - name: Seed public-repo from GitHub Releases (fallback)
        if: steps.pages-cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p public-repo/_seed
          echo "ℹ Pages history cache miss — rehydrating from GitHub Releases"
          tags="$(gh release list --limit 100 --json tagName --jq '.[].tagName' || true)"
          if [[ -z "$tags" ]]; then
            echo "ℹ No previous releases found — starting fresh"
            rm -rf public-repo/_seed
            exit 0
          fi
          # Skip the release we are publishing right now (it is already
          # present in dist/ and will be merged by publish-repo.sh).
          current="${GITHUB_REF_NAME:-}"
          for tag in $tags; do
            [[ "$tag" == "$current" ]] && continue
            echo "  ↳ downloading assets from $tag"
            gh release download "$tag" \
              --dir public-repo/_seed \
              --pattern '*.deb' --pattern '*.rpm' --pattern '*.pkg.tar.zst' \
              --pattern '*.sig' --pattern '*.asc' \
              --skip-existing || true
          done
          # The fallback only restores the *packages*; reprepro /
          # createrepo_c / repo-add will regenerate all metadata under
          # public-repo/{apt,rpm,arch}/ when publish-repo.sh runs.
          mv public-repo/_seed/*.{deb,rpm,pkg.tar.zst,sig,asc} dist/ 2>/dev/null || true
          rm -rf public-repo/_seed
          echo "✓ Seeded dist/ with previously released artefacts"

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/import-gpg-key.sh

      - name: Assemble public-repo (apt + rpm + arch via Docker)
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          REPO_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: bash scripts/publish-repo.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Persist the assembled public-repo/ as a workflow cache so the
      # next release can rebuild metadata over previously-published
      # packages without re-downloading every release asset. Cache
      # eviction (7 days unused) is mitigated by the GitHub-Releases
      # fallback in the seed step above.
      - name: Save Pages history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: public-repo
          key: pages-history-v1-${{ github.run_id }}


