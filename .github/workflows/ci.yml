name: CI

# Gate su push e pull request. Prima di questo file `.github/workflows/` non
# esisteva: il badge in README.md puntava a un `ci.yml` inesistente e nulla
# verificava automaticamente che l'albero fosse verde.
#
# Un solo job di proposito: `npm run check` è già la catena completa
# (guardie → typecheck → test → go vet/build → build Vite) e duplicarne i
# passi in job separati significherebbe mantenerli allineati a mano. L'unica
# cosa che `check` non fa è eseguire i test Go, quindi si aggiunge quella.
#
# Runner: ubuntu-22.04, non `ubuntu-latest`. Serve la glibc più vecchia che
# vogliamo supportare: un binario compilato su 24.04 (glibc 2.39) non parte su
# Debian 12 (2.36) né su Ubuntu 22.04 (2.35). Il pin è ciò che rende il binario
# davvero portatile fra le distro dell'elenco.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test e build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Il backend mpv è cgo: senza le librerie di sviluppo `go vet`/`go build`
      # con i tag `gtk3 mpv` non compilano. `libwebkit2gtk-4.1-dev` esiste da
      # jammy, ed è il motivo per cui il pin a 22.04 non è un problema.
      - name: Dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libmpv-dev

      # `wails3 generate bindings` produce frontend/bindings/, che è
      # gitignorato: senza il CLI la build del frontend non parte.
      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.93

      - name: Dipendenze npm
        run: npm ci

      # Catena completa: check:deps, typecheck, vitest, guardie media3/wails,
      # go vet + go build, build Vite.
      - name: npm run check
        run: npm run check

      # `check:go` fa solo vet + build: i test Go vanno eseguiti a parte.
      # Con i tag reali, così si esercita il backend mpv e non lo stub.
      - name: Test Go
        env:
          CGO_CFLAGS_ALLOW: '-fno-strict-overflow|-fstack-clash-protection|-fcf-protection|-fno-omit-frame-pointer'
        run: go test -tags 'gtk3 mpv' -count=1 ./internal/... ./cmd/...

      - name: Test Go con race detector
        env:
          CGO_CFLAGS_ALLOW: '-fno-strict-overflow|-fstack-clash-protection|-fcf-protection|-fno-omit-frame-pointer'
        run: go test -tags 'gtk3 mpv' -race -count=1 ./internal/...
