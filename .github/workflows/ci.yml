name: CI

# Pipeline di Continuous Integration per StreamAI IPTV (G.4 IMPROVEMENT_TODO).
#
# Trigger:
#   - push su qualsiasi branch (vede subito se main si rompe)
#   - pull_request → main (gate per merge: la PR mostra il check verde)
#
# Cosa esegue (in ordine, mirror di `npm run check`):
#   1. check:deps            — guard dipendenze testing-library
#   2. typecheck             — `tsc --noEmit`
#   3. test:run              — Vitest (209/209 expected, target ≥ 200)
#   4. check:media3          — guard regressioni ExoPlayer2 nel plugin Android
#   5. check:wails           — guard versione Wails v3
#   6. check:go              — `go vet` + build dry-run di cmd/streamai con
#                              `-tags 'gtk3 mpv'` (richiede libwebkit2gtk-4.1
#                              + libmpv-dev + pkg-config)
#   7. build                 — `vite build` per validare che il bundle
#                              frontend si emetta correttamente
#
# Runner: ubuntu-24.04 (noble). Wails v3 supporta Linux x86_64 con
# webkit2gtk-4.1 (default su Ubuntu 24.04). Node 20 LTS (allineato a
# Vite 7 / Vitest 3 / React 19).
#
# Caching: actions/setup-node abilita cache npm (lockfile-based);
# actions/setup-go abilita cache modules + build cache.

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck + tests + go build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install Linux system dependencies (WebKitGTK 4.1 + libmpv)
        # Richiesti da `npm run check:go` con build-tag `gtk3 mpv`:
        # - libgtk-3-dev + libwebkit2gtk-4.1-dev: Wails v3 webview backend
        # - libmpv-dev: libmpv render-API (internal/services/player)
        # - libayatana-appindicator3-dev: system tray (internal/pkg/tray)
        # - pkg-config: risoluzione cgo flags per le librerie sopra
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libmpv-dev \
            libayatana-appindicator3-dev

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Print effective version
        run: npm run version:full --silent || true

      - name: check:deps (testing-library guard)
        run: npm run check:deps

      - name: typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: test:run (Vitest)
        run: npm run test:run

      - name: check:media3 (ExoPlayer2 regression guard)
        run: npm run check:media3

      - name: check:wails (Wails v3 version guard)
        run: npm run check:wails

      - name: check:go (go vet + build cmd/streamai with mpv tags)
        run: npm run check:go

      - name: build (vite build)
        run: npm run build

      - name: Go tests (internal/...)
        # Eseguito DOPO check:go così la cache è già calda. Usa gli
        # stessi tag ma con `go test` invece di `go build`. Il backend
        # libmpv stub (no `-tags mpv`) e' il default delle test suite
        # in `events_test.go` (`//go:build !mpv`).
        env:
          CGO_CFLAGS_ALLOW: '-fno-strict-overflow|-fstack-clash-protection|-fcf-protection|-fno-omit-frame-pointer'
        run: go test -tags 'gtk3' ./internal/...

